<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>What a Million Tokens Costs</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #ffffff; color: #171717; padding: 28px 24px 20px;
  }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  p.sub { font-size: 11.5px; color: #737373; margin-top: 4px; }
  .legend { display: flex; gap: 14px; margin: 14px 0 6px; font-size: 11px; color: #525252; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .row { display: grid; grid-template-columns: 118px 1fr; align-items: center; gap: 10px; margin-top: 10px; }
  .name { font-size: 11.5px; font-weight: 600; color: #262626; text-align: right; }
  .bars { display: flex; flex-direction: column; gap: 3px; }
  .bar { height: 13px; border-radius: 4px; position: relative; cursor: default;
         transition: transform .15s ease, filter .15s ease; transform-origin: left center; }
  .bar:hover { transform: scaleY(1.25); filter: brightness(1.08); }
  .bar.in  { background: #10b981; }
  .bar.out { background: #a7f3d0; }
  .bar b { position: absolute; left: calc(100% + 7px); top: 50%; translate: 0 -50%;
           font-size: 10px; font-weight: 600; color: #525252; white-space: nowrap; }
  .note { margin-top: 16px; font-size: 10.5px; color: #a3a3a3; }
</style>
</head>
<body>
  <h1>What a million tokens costs (USD)</h1>
  <p class="sub">API list prices per 1M tokens, as shown in Wolffish's model catalog — log scale, hover the bars.</p>
  <div class="legend">
    <span><i class="dot" style="background:#10b981"></i> Input</span>
    <span><i class="dot" style="background:#a7f3d0"></i> Output</span>
  </div>
  <div id="chart"></div>
  <p class="note">A budget model runs a personal agent for a few dollars a month — premium models multiply that severalfold.</p>
<script>
  const MODELS = [
    { name: "DeepSeek V4 Flash", input: 0.14, output: 0.28 },
    { name: "DeepSeek V4 Pro",   input: 0.44, output: 0.87 },
    { name: "Grok 4.3",          input: 1.25, output: 2.5  },
    { name: "Grok 4.6",          input: 2,    output: 6    },
    { name: "Claude Fable 5",    input: 10,   output: 50   },
  ];
  const MAX = 50;
  const scale = (v) => 4 + 96 * (Math.log10(v / 0.1) / Math.log10(MAX / 0.1));
  const chart = document.getElementById("chart");
  for (const m of MODELS) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<div class="name">' + m.name + "</div>" +
      '<div class="bars">' +
      '<div class="bar in"  style="width:' + scale(m.input)  + '%" title="Input: $' + m.input + ' per 1M tokens"><b>$' + m.input + "</b></div>" +
      '<div class="bar out" style="width:' + scale(m.output) + '%" title="Output: $' + m.output + ' per 1M tokens"><b>$' + m.output + "</b></div>" +
      "</div>";
    chart.appendChild(row);
  }
</script>
</body>
</html>
